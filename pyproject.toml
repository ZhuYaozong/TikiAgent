[project]
name = "tikiagent"
version = "0.7.0"
description = "A multi-agent task execution system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1,<1.0.0",
    "langgraph>=1.2.11,<2.0.0",
    "openai>=1.68.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
tikiagent = "tikiagent.application.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
